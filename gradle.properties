org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Experiencia 3 -----------------------------------------------------------------------------
# Modo de la aplicación. USAR_API solo define el valor INICIAL del interruptor "Modo local (sin
# servidor)" de la pantalla de ingreso; después manda lo que se elija en la app (se guarda en el
# dispositivo) y el cambio no requiere recompilar. Si se edita USAR_API y se recompila, el nuevo
# valor vuelve a regir como valor inicial.
#   USAR_API=false  Arranca en modo local (punto de partida): Room + despacho simulado, SIN servidor.
#                   Funciona completa tal como está entregada.
#   USAR_API=true   Arranca en modo servidor: login, datos, envíos y canal preferente pasan por el
#                   backend. Depende de lo que se implemente en los TODO(E3-n); activarlo ANTES de
#                   terminar la Parte 2 y la Parte 3 hace fallar la app con NotImplementedError.
# En la defensa debe mostrarse el modo servidor; el modo local es solo un respaldo.
USAR_API=false

# URL base de la API (backend). 10.0.2.2 es el PC anfitrión visto desde el emulador de Android
# Studio. Debe terminar en "/". Cambiarla aquí requiere recompilar; para cambiarla sin recompilar
# usar el botón "Servidor" de la pantalla de ingreso (modo API).
API_BASE_URL=http://10.0.2.2:3000/

# Firma del APK release (opcional). NO escribir aquí claves reales: definir estas cuatro
# propiedades en keystore.properties (ver keystore.properties.example), en
# ~/.gradle/gradle.properties (fuera del repositorio) o como variables de entorno con el mismo
# nombre. Si no existen, el build release se genera igualmente sin firma.
#   MPAZ_STORE_FILE=/ruta/absoluta/al/almacen.jks
#   MPAZ_STORE_PASSWORD=...
#   MPAZ_KEY_ALIAS=...
#   MPAZ_KEY_PASSWORD=...
